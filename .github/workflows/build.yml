name: build-cache
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest] 
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27

      - uses: cachix/cachix-action@v14
        with:
          name: dmlane
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build ffmpeg-with-vmaf
        run: nix build .#ffmpeg-with-vmaf --print-build-logs

      - name: Push build result to Cachix
        run: cachix push dmlane ./result

