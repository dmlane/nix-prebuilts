name: build-cache

on:
  push:
    branches: [ main ]
    paths:
      - 'pkgs/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  #
  plan:
    runs-on: ubuntu-latest
    outputs:
      packages_linux: ${{ steps.plan.outputs.packages_linux }}
      packages_darwin: ${{ steps.plan.outputs.packages_darwin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Compute changed packages
        id: plan
        run: |
          set -euo pipefail

          # Decide diff base (previous commit or empty for first push)
          if [[ "${{ github.event_name }}" == "push" && -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          else
            base="$(git rev-parse HEAD^ || true)"
          fi

          files=""
          if [[ -n "$base" ]]; then
            files="$(git diff --name-only "$base"...HEAD -- 'pkgs/**' 'flake.nix' 'flake.lock' || true)"
          fi

          echo "Changed files:"
          printf '%s\n' "${files}"

          full_rebuild=false
          if [[ -z "$base" ]] || echo "$files" | grep -qE '(^|/)(flake\.nix|flake\.lock)'; then
            full_rebuild=true
          fi

          # Map pkgs/** paths -> package names (dir name or file stem)
          mapfile -t changed_pkgs < <(
            awk 'NF' <(printf '%s\n' "${files}") | while read -r f; do
              case "$f" in
                pkgs/*.nix) basename "${f%.nix}" ;;
                pkgs/*/*.nix) basename "$(dirname "$f")" ;;
              esac
            done | awk 'NF && !seen[$0]++'
          )

          # All package names for each platform
          mapfile -t all_linux  < <(nix eval --json .#packages.x86_64-linux   | jq -r 'keys[]' | grep -v '^default$' || true)
          mapfile -t all_darwin < <(nix eval --json .#packages.aarch64-darwin | jq -r 'keys[]' | grep -v '^default$' || true)

          to_json_array() { jq -R . | jq -s .; }

          if $full_rebuild; then
            printf '%s\n' "${all_linux[@]}"  | to_json_array | tee /tmp/linux.json
            printf '%s\n' "${all_darwin[@]}" | to_json_array | tee /tmp/darwin.json
          else
            printf '%s\n' "${changed_pkgs[@]}" | awk 'NF' | while read -r p; do
              if printf '%s\n' "${all_linux[@]}" | grep -qx "$p"; then echo "$p"; fi
            done | to_json_array | tee /tmp/linux.json

            printf '%s\n' "${changed_pkgs[@]}" | awk 'NF' | while read -r p; do
              if printf '%s\n' "${all_darwin[@]}" | grep -qx "$p"; then echo "$p"; fi
            done | to_json_array | tee /tmp/darwin.json

            # If nothing matched, rebuild all
            if [[ "$(jq 'length' /tmp/linux.json)" == "0" && "$(jq 'length' /tmp/darwin.json)" == "0" ]]; then
              printf '%s\n' "${all_linux[@]}"  | to_json_array > /tmp/linux.json
              printf '%s\n' "${all_darwin[@]}" | to_json_array > /tmp/darwin.json
            fi
          fi

          {
            echo "packages_linux<<EOF"
            cat /tmp/linux.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "packages_darwin<<EOF"
            cat /tmp/darwin.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-linux:
    needs: plan
    if: ${{ needs.plan.outputs.packages_linux != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.plan.outputs.packages_linux) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure Cachix
        uses: cachix/cachix-action@v15
        with:
          name: dmlane
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build, push and pin
        run: |
          set -euo pipefail
          pkg="${{ matrix.package }}"
          echo ">>> Building .#$pkg (Linux)"

          # Build and collect all outputs (out, man, dev, etc.) as JSON array
          outs=$(nix build --no-link --json ".#$pkg" \
            | jq -r '[.[].outputs | to_entries[] | .value]')

          # Safely export multi-line JSON to GITHUB_OUTPUT
          {
            echo "outs<<EOF"
            echo "$outs"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # Push and pin every path individually
          echo "$outs" | jq -r '.[]' | while read -r p; do
            echo ">>> Pushing & pinning $p"
            cachix push dmlane "$p"
            cachix pin dmlane "${pkg}-linux" "$p" --keep-revisions 5
          done

  build-darwin:
    needs: plan
    if: ${{ needs.plan.outputs.packages_darwin != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.plan.outputs.packages_darwin) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            experimental-features = nix-command flakes
          trust-runner-user: true
          start-daemon: true

      - name: Configure Cachix
        uses: cachix/cachix-action@v15
        with:
          name: dmlane
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build, push and pin (macOS)
        run: |
          set -euo pipefail
          pkg="${{ matrix.package }}"
          echo ">>> Building .#$pkg (Darwin)"

          # Build and collect all outputs as JSON array
          outs=$(nix build --no-link --json ".#$pkg" \
            | jq -r '[.[].outputs | to_entries[] | .value]')

          {
            echo "outs<<EOF"
            echo "$outs"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "$outs" | jq -r '.[]' | while read -r p; do
            echo ">>> Pushing & pinning $p"
            cachix push dmlane "$p"
            cachix pin dmlane "${pkg}-darwin" "$p" --keep-revisions 5
          done

