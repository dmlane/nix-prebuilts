name: build-cache

on:
  push:
    branches: [ main ]
    paths:
      - 'pkgs/**'
      - 'flake.nix'
      - 'flake.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      packages_linux: ${{ steps.plan.outputs.packages_linux }}
      packages_darwin: ${{ steps.plan.outputs.packages_darwin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Compute changed files & package matrix
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          # Decide diff base (previous commit for push; handles first push too)
          if [[ "${{ github.event_name }}" == "push" && -n "${{ github.event.before }}" && \
                "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          else
            base="$(git rev-parse HEAD^ || true)"
          fi

          files=""
          if [[ -n "${base}" ]]; then
            files="$(git diff --name-only "$base"...HEAD -- \
              'pkgs/**' 'flake.nix' 'flake.lock' '.github/workflows/build.yml' || true)"
          fi

          echo "Changed files:"
          printf '%s\n' "${files}"

          full_rebuild=false
          if [[ -z "${base}" ]] || echo "${files}" | grep -qE '(^|/)(flake\.nix|flake\.lock)'; then
            full_rebuild=true
          fi

          # Map pkgs/** paths -> package names (dir name or file stem)
          mapfile -t changed_pkgs < <(
            awk 'NF' <(printf '%s\n' "${files}") | while read -r f; do
              case "$f" in
                pkgs/*.nix)
                  basename "${f%.nix}"
                  ;;
                pkgs/*/*.nix)
                  basename "$(dirname "$f")"
                  ;;
              esac
            done | awk 'NF && !seen[$0]++'
          )

          # All package names per system (used for verification and full rebuild)
          mapfile -t all_linux   < <(nix eval --json .#packages.x86_64-linux    | jq -r 'keys[]' | grep -v '^default$' || true)
          mapfile -t all_darwin  < <(nix eval --json .#packages.aarch64-darwin  | jq -r 'keys[]' | grep -v '^default$' || true)

          to_json_array() { jq -R . | jq -s .; }

          if $full_rebuild; then
            printf '%s\n' "${all_linux[@]}"  | to_json_array | tee /tmp/linux.json
            printf '%s\n' "${all_darwin[@]}" | to_json_array | tee /tmp/darwin.json
          else
            # Verify changed pkgs exist per system
            printf '%s\n' "${changed_pkgs[@]}" | awk 'NF' | while read -r p; do
              if printf '%s\n' "${all_linux[@]}"  | grep -qx "$p"; then echo "$p"; fi
            done | to_json_array | tee /tmp/linux.json

            printf '%s\n' "${changed_pkgs[@]}" | awk 'NF' | while read -r p; do
              if printf '%s\n' "${all_darwin[@]}" | grep -qx "$p"; then echo "$p"; fi
            done | to_json_array | tee /tmp/darwin.json

            # If neither side has anything (e.g. new attr name mismatch), fall back to full rebuild
            if [[ "$(jq 'length' /tmp/linux.json)" == "0" && "$(jq 'length' /tmp/darwin.json)" == "0" ]]; then
              printf '%s\n' "${all_linux[@]}"  | to_json_array > /tmp/linux.json
              printf '%s\n' "${all_darwin[@]}" | to_json_array > /tmp/darwin.json
            fi
          fi

          # Output multi-line JSON arrays safely for GitHub Actions
          {
            echo "packages_linux<<EOF"
            cat /tmp/linux.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "packages_darwin<<EOF"
            cat /tmp/darwin.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-linux:
    needs: plan
    if: ${{ needs.plan.outputs.packages_linux != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        package: ${{ fromJson(needs.plan.outputs.packages_linux) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure Cachix
        uses: cachix/cachix-action@v15
        with:
          name: dmlane
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build & push (Linux)
        run: |
          set -euo pipefail
          echo ">>> Building .#${{ matrix.package }} on Linux"
          cachix watch-exec dmlane -- nix build -L ".#${{ matrix.package }}" --out-link ./result

      - name: Pin build (keep last 5 versions)
        run: |
          set -euo pipefail
          .github/scripts/pin_keep5.sh dmlane "${{ matrix.package }}" ./result

      - name: Verify VMAF for ffmpeg
        if: matrix.package == 'ffmpeg-with-vmaf'
        run: ./result/bin/ffmpeg -hide_banner -filters | grep -i vmaf

  build-darwin:
    needs: plan
    if: ${{ needs.plan.outputs.packages_darwin != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        package: ${{ fromJson(needs.plan.outputs.packages_darwin) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure Cachix
        uses: cachix/cachix-action@v15
        with:
          name: dmlane
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build & push (Darwin)
        run: |
          set -euo pipefail
          echo ">>> Building .#${{ matrix.package }} on macOS"
          cachix watch-exec dmlane -- nix build -L ".#${{ matrix.package }}" --out-link ./result

      - name: Pin build (keep last 5 versions)
        run: |
          set -euo pipefail
          .github/scripts/pin_keep5.sh dmlane "${{ matrix.package }}" ./result

      - name: Verify VMAF for ffmpeg
        if: matrix.package == 'ffmpeg-with-vmaf'
        run: ./result/bin/ffmpeg -hide_banner -filters | grep -i vmaf

