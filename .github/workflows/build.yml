name: build-cache

on:
  push:
    branches: [ main ]
    paths:
      - 'pkgs/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Discover "what changed" and map to package names.
  plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Get changed files (works for push & workflow_dispatch; for PRs add pull_request trigger and base SHA handling)
      - name: Compute changed files
        id: changes
        run: |
          set -euo pipefail

          # Determine diff base
          if [[ "${{ github.event_name }}" == "push" && -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          else
            # Fallback to previous commit on the same branch
            base="$(git rev-parse HEAD^ || true)"
          fi

          if [[ -z "${base}" ]]; then
            echo "No base commit found; treat as full rebuild."
            echo "full_rebuild=true" >> "$GITHUB_OUTPUT"
            echo "changed=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only "$base"...HEAD -- \
            'pkgs/**' 'flake.nix' 'flake.lock' '.github/workflows/build.yml' || true)

          echo "Changed files:"
          echo "${files}"

          if echo "${files}" | grep -qE '(^|/)(flake\.nix|flake\.lock)'; then
            echo "Detected flake file changes → full rebuild."
            echo "full_rebuild=true" >> "$GITHUB_OUTPUT"
            echo "changed=${files//$'\n'/,}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If only pkgs/** changed, map to package names.
          # Conventions supported:
          #   pkgs/foo.nix            → foo
          #   pkgs/foo/default.nix    → foo
          #   pkgs/foo/anything.nix   → foo
          # If we can’t map, fall back to full rebuild.
          pkgs=()

          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              pkgs/*.nix)
                name="$(basename "$f" .nix)"
                pkgs+=("$name")
                ;;
              pkgs/*/*.nix)
                dir="$(dirname "$f")"
                name="$(basename "$dir")"
                pkgs+=("$name")
                ;;
            esac
          done <<< "${files}"

          # Dedup
          readarray -t uniq_pkgs < <(printf '%s\n' "${pkgs[@]}" | awk 'NF && !x[$0]++')

          if [[ "${#uniq_pkgs[@]}" -eq 0 ]]; then
            echo "Could not map changes to specific packages → full rebuild."
            echo "full_rebuild=true" >> "$GITHUB_OUTPUT"
            echo "changed=${files//$'\n'/,}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Verify the packages exist in the flake outputs. If verification fails, full rebuild.
          all_pkgs_json="$(nix eval --json .#packages.x86_64-linux | jq -r 'keys[]')"
          verified=()
          for p in "${uniq_pkgs[@]}"; do
            if echo "${all_pkgs_json}" | grep -qx "$p"; then
              verified+=("$p")
            else
              echo "Warning: '$p' not in flake outputs; will trigger full rebuild."
              echo "full_rebuild=true" >> "$GITHUB_OUTPUT"
              echo "changed=${files//$'\n'/,}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          # Build JSON array
          json=$(printf '%s\n' "${verified[@]}" | jq -R . | jq -s .)
          echo "Selected packages: ${json}"
          echo "full_rebuild=false" >> "$GITHUB_OUTPUT"
          echo "packages=${json}" >> "$GITHUB_OUTPUT"

    outputs:
      full_rebuild: ${{ steps.changes.outputs.full_rebuild }}
      packages: ${{ steps.changes.outputs.packages }}

  # If flake changed (or mapping failed), build ALL packages (minus "default").
  build-all:
    needs: plan
    if: needs.plan.outputs.full_rebuild == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure Cachix
        uses: cachix/cachix-action@v15
        with:
          name: dmlane
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Resolve all package names
        id: list
        run: |
          set -euo pipefail
          # Use Linux just to enumerate names
          pkgs_json=$(nix eval --json .#packages.x86_64-linux | jq -c 'keys | map(select(. != "default"))')
          echo "pkgs=$pkgs_json" >> "$GITHUB_OUTPUT"

      - name: Build & push all (matrix)
        run: |
          set -euo pipefail
          for pkg in $(echo '${{ steps.list.outputs.pkgs }}' | jq -r '.[]'); do
            echo ">>> Building .#$pkg on ${{ matrix.os }}"
            cachix watch-exec dmlane -- nix build -L ".#$pkg"
          done

  # If only some pkgs changed, build just those.
  build-some:
    needs: plan
    if: needs.plan.outputs.full_rebuild != 'true' && needs.plan.outputs.packages != '[]' && needs.plan.outputs.packages != ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        package: ${{ fromJson(needs.plan.outputs.packages) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure Cachix
        uses: cachix/cachix-action@v15
        with:
          name: dmlane
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build & push (changed package)
        run: |
          set -euo pipefail
          echo ">>> Building .#${{ matrix.package }} on ${{ matrix.os }}"
          cachix watch-exec dmlane -- nix build -L ".#${{ matrix.package }}"

      # Optional sanity check for ffmpeg-with-vmaf
      - name: Verify VMAF filter
        if: matrix.package == 'ffmpeg-with-vmaf'
        run: |
          ./result/bin/ffmpeg -hide_banner -filters | grep -i vmaf

