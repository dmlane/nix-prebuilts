name: "Build & Cache all pkgs"

on:
  push:
    #
    branches: [ main ]
    paths:
      - 'pkgs/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      packages_linux: ${{ steps.plan.outputs.packages_linux }}
      packages_darwin: ${{ steps.plan.outputs.packages_darwin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Detect changed pkgs
        id: plan
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD^ || true)"
          files="$(git diff --name-only "$base"...HEAD -- pkgs/** flake.nix flake.lock .github/workflows/build.yml || true)"
          echo "Changed files:"
          echo "$files"

          full_rebuild=false
          if [[ -z "$base" ]] || echo "$files" | grep -qE 'flake\.(nix|lock)'; then
            full_rebuild=true
          fi

          mapfile -t changed < <(
            echo "$files" | awk 'NF' | while read -r f; do
              case "$f" in
                pkgs/*.nix) basename "${f%.nix}" ;;
                pkgs/*/*.nix) basename "$(dirname "$f")" ;;
              esac
            done | sort -u
          )

          mapfile -t all_linux  < <(nix eval --json .#packages.x86_64-linux   | jq -r 'keys[]' | grep -v '^default$' || true)
          mapfile -t all_darwin < <(nix eval --json .#packages.aarch64-darwin | jq -r 'keys[]' | grep -v '^default$' || true)

          to_json() { jq -R . | jq -s .; }

          if $full_rebuild || [ ${#changed[@]} -eq 0 ]; then
            printf '%s\n' "${all_linux[@]}"  | to_json | tee linux.json
            printf '%s\n' "${all_darwin[@]}" | to_json | tee darwin.json
          else
            printf '%s\n' "${changed[@]}" | while read -r p; do
              if printf '%s\n' "${all_linux[@]}" | grep -qx "$p"; then echo "$p"; fi
            done | to_json | tee linux.json

            printf '%s\n' "${changed[@]}" | while read -r p; do
              if printf '%s\n' "${all_darwin[@]}" | grep -qx "$p"; then echo "$p"; fi
            done | to_json | tee darwin.json
          fi

          echo "packages_linux<<EOF" >> "$GITHUB_OUTPUT"
          cat linux.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "packages_darwin<<EOF" >> "$GITHUB_OUTPUT"
          cat darwin.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ${{ matrix.os }}
    if: ${{ needs.plan.outputs.packages_linux != '[]' || needs.plan.outputs.packages_darwin != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        package: ${{ fromJson(matrix.os == 'ubuntu-latest' && needs.plan.outputs.packages_linux || needs.plan.outputs.packages_darwin) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix (Linux)
        if: runner.os == 'Linux'
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install Nix (macOS)
        if: runner.os == 'macOS'
        uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Configure Cachix
        uses: cachix/cachix-action@v15
        with:
          name: dmlane
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build & push package
        id: buildpkg
        run: |
          set -euo pipefail
          pkg="${{ matrix.package }}"
          echo ">>> Building .#$pkg on ${{ matrix.os }}"
          out=$(nix build --no-link --json ".#$pkg" | jq -r '.[].outputs.out')
          echo "out=$out" >> "$GITHUB_OUTPUT"
          cachix push dmlane "$out"

      - name: Pin latest build (keep 5)
        run: |
          pkg="${{ matrix.package }}"
          os="${{ matrix.os }}"
          arch_suffix=$([[ "$os" == ubuntu-* ]] && echo linux || echo darwin)
          pin_name="${pkg}-${arch_suffix}"
          cachix pin dmlane "$pin_name" "${{ steps.buildpkg.outputs.out }}" --keep-revisions 5

