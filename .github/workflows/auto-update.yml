name: auto-update-flake
on:
  schedule:
    - cron: '0 3 2 * *'   #  03:00 UTC on 3nd day of month
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update inputs
        run: nix flake update

      # Optional: bail out if nothing changed
      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: nix flake update"
          title: "chore: bump nixpkgs & inputs"
          body: "Automated flake update."
          branch: bot/flake-update
          labels: dependencies
          signoff: true

